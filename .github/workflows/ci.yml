name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.24.x"

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "$out"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: generate
        run: |
          go generate ./...
          test -z "$(git status --porcelain zz_generated.go)"

      - name: test
        run: go test ./...

      - name: race
        run: go test -race ./...

      - name: build
        run: go build ./...

      - name: examples
        run: |
          for d in examples/*/; do
            go build -o /dev/null "./$d"
          done

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
