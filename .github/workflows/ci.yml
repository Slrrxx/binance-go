name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: vet
        run: go vet ./...

      - name: generate
        run: |
          go generate ./...
          test -z "$(git status --porcelain zz_generated.go)"

      - name: test
        run: go test -coverprofile=coverage.out ./...

      - name: race
        run: go test -race ./...

      - name: build
        run: go build ./...

      - name: coverage
        uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          files: coverage.out
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: examples
        run: |
          for d in examples/*/; do
            go build -o /dev/null "./$d"
          done

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
